[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "automcp"
version = "2.0.0"
description = "AutoMCP 2.0 — Browser-to-MCP tool generator"
requires-python = ">=3.11"
dependencies = [
    "playwright>=1.44.0",
    "fastmcp>=2.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "aiosqlite>=0.20.0",
    "jinja2>=3.1.4",
    "anthropic>=0.30.0",
    "rich>=13.7.0",
    "typer>=0.12.0",
    "python-dotenv>=1.0.0",
    "cryptography>=42.0.0",
    "fastapi>=0.111.0",
    "uvicorn>=0.30.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
# Google Gemini for `automcp analyze` (has a free tier)
gemini = ["google-genai>=2.0.0"]
# OpenAI for `automcp analyze --provider openai` (structured outputs need 1.40+)
openai = ["openai>=1.50.0"]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    # Pinned: new ruff versions turn on new rules, which would fail the GitHub checks
    "ruff>=0.17.3,<0.18",
    "mypy>=1.10.0",
]

[project.scripts]
automcp = "apps.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["apps", "core"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
ignore = [
    # `except Exception` is used on purpose where one failure must not stop a
    # bigger job (a recording, a tool call, a dashboard request); the error is
    # reported instead
    "BLE001",
]

[tool.ruff.lint.per-file-ignores]
# Closing the browser and reading page responses is best effort: a failure
# there must never lose the recording
"core/recorder/*" = ["S110"]

[tool.ruff.lint.flake8-bugbear]
# Typer declares command options as argument defaults
extend-immutable-calls = ["typer.Argument", "typer.Option"]
